bundle:
  name: demo03_bundle

include:
  - "./resources/variables.yml"
  - "./resources/pipeline/health_etl_pipeline.pipeline.yml"
  - "./resources/job/dabs_workflows.job.yml"

variables:
  my_lab_user_name:
    description: Add your user name
    default: ${workspace.current_user.short_name}

  catalog_dev:
    description: Development catalog for the project. Append 1_dev to the user name.
    default: dev

  catalog_prod:
    description: Production catalog for the project. Append 1_prod to the user name.
    default: prd

  target_catalog:
    description: Target catalog to use for deployment - default is 'dev'
    default: ${var.catalog_dev}

  raw_data_path:
    description: Path to source CSV files to ingest (dev/stage/prod)
    default: /volumes/${var.target_catalog}/default/health


targets:
  development:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}


  production:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      target_catalog: ${var.catalog_prod}






















